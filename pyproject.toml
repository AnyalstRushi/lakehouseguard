[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouseguard"
version = "1.0.0"
description = "Contract-driven, self-healing Medallion lakehouse with an offline-first AI incident agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rushikesh Wavhal" }]
dependencies = ["pandas>=3.0", "numpy>=1.24", "PyYAML>=6.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
spark = ["pyspark>=3.5", "delta-spark>=3.1"]
dev = ["pytest>=8", "coverage>=7", "ruff>=0.5"]

[project.scripts]
lakehouseguard = "lakehouseguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lakehouseguard = ["knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["src/lakehouseguard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
