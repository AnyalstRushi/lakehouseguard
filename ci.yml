name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests with coverage (fails under 90%)
        run: |
          coverage run -m pytest -q
          coverage report
      - name: Benchmark smoke test
        run: python benchmarks/run_benchmark.py --seeds 3 --out /tmp/bench.json
      - name: Contract gate on a sample file (producer-CI usage)
        run: |
          lakehouseguard demo --root /tmp/lh --out /tmp/site
          python - <<'PY'
          import pandas as pd, sys
          sys.path.insert(0, "src")
          from lakehouseguard.generator import generate_orders, utc
          generate_orders(300, utc(2026, 10, 10, 5), seed=1).to_csv("/tmp/orders.csv", index=False)
          PY
          lakehouseguard validate /tmp/orders.csv

  spark-smoke:
    # Optional: the same contract gate expressed in PySpark + Delta Lake (see examples/spark_engine.py).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[spark]"
      - run: python examples/spark_smoke.py
