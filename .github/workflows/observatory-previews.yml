name: Build and verify Observatory previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_previews.py'
      - '.github/workflows/observatory-previews.yml'
      - 'results.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observatory-previews
  cancel-in-progress: true
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Render GIFs and validate frames and image paths
        run: python scripts/render_previews.py
      - uses: actions/upload-artifact@v4
        with:
          name: observatory-preview-assets
          path: assets/observatory-*.gif
          if-no-files-found: error
      - name: Commit only generated previews and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/observatory-hero.gif assets/observatory-architecture.gif assets/observatory-evidence.gif README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: embed verified animated Observatory previews'
            git push origin HEAD:main
          fi
